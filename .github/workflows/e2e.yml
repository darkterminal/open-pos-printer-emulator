name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Prepare env files
        run: |
          cp apps/web/.env.example apps/web/.env
          cp apps/sidecar/.env.example apps/sidecar/.env
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('apps/web/.env')
          s = p.read_text()
          for k, v in {
              'CACHE_STORE': 'file',
              'SESSION_DRIVER': 'file',
              'QUEUE_CONNECTION': 'sync',
              'BROADCAST_CONNECTION': 'reverb',
              'APP_URL': 'http://localhost:8080',
              'REVERB_HOST': 'localhost',
              'REVERB_PORT': '8081',
              'REVERB_SCHEME': 'http',
          }.items():
              s = re.sub(rf'^{k}=.*$', f'{k}={v}', s, flags=re.M)
          p.write_text(s)
          PY


      - name: Start stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --build

      - name: Setup Laravel
        run: |
          for i in {1..60}; do
            docker compose -f compose.yaml -f compose.ci.yaml exec -T web php artisan --version >/dev/null 2>&1 && break
            sleep 2
          done
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web php artisan key:generate --force --no-interaction
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web php artisan optimize:clear
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web php artisan migrate --force
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web php artisan db:seed --force
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web sh -lc 'if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then npm ci; fi'
          docker compose -f compose.yaml -f compose.ci.yaml exec -T web npm run build

      - name: Wait for web
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /tmp/web-login.html -w "%{http_code}" http://localhost:8080/login || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 2
          done
          echo "Web did not become ready; last response:"
          cat /tmp/web-login.html || true
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color web | tail -200 || true
          exit 1

      - name: Install Playwright
        working-directory: apps/web
        run: |
          sudo chown -R runner:runner node_modules || true
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml logs --no-color > compose-e2e.log

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-logs
          path: compose-e2e.log

      - name: Shutdown
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
