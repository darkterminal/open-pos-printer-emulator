name: Windows Agent

on:
  push:
    branches: [main]
    paths:
      - 'apps/windows-agent/**'
      - '.github/workflows/windows-agent.yml'
  pull_request:
    paths:
      - 'apps/windows-agent/**'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/windows-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --verbose

      - name: Cargo test
        run: cargo test --verbose

  build-windows:
    runs-on: windows-latest
    needs: check
    defaults:
      run:
        working-directory: apps/windows-agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --verbose

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/oppe-windows-agent.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath oppe-windows-agent-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppe-windows-agent-x64
          path: apps/windows-agent/oppe-windows-agent-x64.zip
          if-no-files-found: error
