name: Bug report
description: Report incorrect behavior or an error
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Open POS Printer Emulator is a development/QA tool. Please include enough detail to reproduce the issue locally.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include steps, ESC/POS payload, or an `nc` script.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidence
      description: Paste sidecar/web logs, screenshots, or relevant payloads.
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: main@<sha> or v0.1.0
