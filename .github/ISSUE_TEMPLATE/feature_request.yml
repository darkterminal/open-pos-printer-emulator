name: Feature request
description: Suggest a feature or improvement
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / need
      description: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / notes
      description: Constraints, alternatives, or compatibility impact.
