services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-escpos}
      POSTGRES_USER: ${POSTGRES_USER:-escpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-escpos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-escpos} -d ${POSTGRES_DB:-escpos}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: escpos-emulator-web:dev
    env_file:
      - ./apps/web/.env
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-escpos}
      DB_USERNAME: ${POSTGRES_USER:-escpos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-escpos}
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REVERB_HOST: localhost
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      SIDECAR_INTERNAL_URL: http://sidecar:3001
      SIDECAR_SHARED_TOKEN: ${SIDECAR_SHARED_TOKEN:-dev-sidecar-token}
    volumes:
      - ./apps/web:/var/www/html
      - web_vendor:/var/www/html/vendor
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "php artisan serve --host=0.0.0.0 --port=8080"]

  reverb:
    image: escpos-emulator-web:dev
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-escpos}
      DB_USERNAME: ${POSTGRES_USER:-escpos}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-escpos}
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    volumes:
      - ./apps/web:/var/www/html
      - web_vendor:/var/www/html/vendor
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "php artisan reverb:start --host=0.0.0.0 --port=8080"]

  sidecar:
    image: escpos-emulator-sidecar:dev
    env_file:
      - ./apps/sidecar/.env
    environment:
      PORT: 3001
      TCP_HOST: 0.0.0.0
      TCP_PORT: 9100
      LARAVEL_INTERNAL_URL: http://web:8080/api/internal/v1
      SIDECAR_SHARED_TOKEN: ${SIDECAR_SHARED_TOKEN:-dev-sidecar-token}
    volumes:
      - ./apps/sidecar:/app
      - sidecar_node_modules:/app/node_modules
    ports:
      - "9100:9100"
      - "3001:3001"
    depends_on:
      - web
    command: ["sh", "-lc", "npm install && npm run dev"]

volumes:
  postgres_data:
  web_vendor:
  sidecar_node_modules:
