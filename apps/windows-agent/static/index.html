<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open POS Printer Emulator - Windows Agent</title>
  <style>
    :root { --bg:#0b0f14; --panel:#121923; --panel2:#182233; --line:#243247; --text:#e7edf5; --muted:#93a4ba; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --err:#f85149; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:var(--sans); background:linear-gradient(180deg,#0b0f14,#0e141d); color:var(--text); }
    header { padding:20px 24px; border-bottom:1px solid var(--line); background:rgba(18,25,35,.8); backdrop-filter:blur(8px); position:sticky; top:0; z-index:2; }
    .wrap { max-width:1400px; margin:0 auto; padding:24px; }
    h1 { margin:0; font-size:20px; font-weight:650; letter-spacing:-.02em; }
    .sub { color:var(--muted); font-size:13px; margin-top:6px; }
    .grid { display:grid; grid-template-columns: 360px 1fr; gap:16px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .panel h2 { margin:0; padding:14px 16px; font-size:13px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--line); text-transform:uppercase; letter-spacing:.04em; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .stat .k { font-size:12px; color:var(--muted); }
    .stat .v { font-size:22px; font-weight:650; margin-top:4px; }
    .jobs { max-height:calc(100vh - 260px); overflow:auto; }
    .job { padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
    .job:hover { background:var(--panel2); }
    .job.active { background:#17263d; border-left:3px solid var(--accent); padding-left:13px; }
    .job .top { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .job .id { font-family:var(--mono); font-size:12px; color:var(--muted); }
    .badge { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); text-transform:uppercase; letter-spacing:.03em; }
    .badge.ok { color:var(--ok); border-color:rgba(63,185,80,.35); background:rgba(63,185,80,.08); }
    .badge.partial { color:var(--warn); border-color:rgba(210,153,34,.35); background:rgba(210,153,34,.08); }
    .badge.parse_error { color:var(--err); border-color:rgba(248,81,73,.35); background:rgba(248,81,73,.08); }
    .job .meta { font-size:12px; color:var(--muted); margin-top:6px; }
    .detail { padding:16px; overflow:auto; max-height:calc(100vh - 260px); }
    .empty { padding:32px 16px; color:var(--muted); text-align:center; }
    pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:var(--mono); font-size:12px; line-height:1.6; }
    .receipt { background:#fff; color:#111; padding:20px; border-radius:8px; font-family:var(--mono); font-size:13px; line-height:1.45; min-height:180px; }
    .receipt .line { min-height:1.45em; white-space:pre-wrap; }
    .receipt .center { text-align:center; }
    .receipt .right { text-align:right; }
    .receipt .bold { font-weight:700; }
    .receipt .u { text-decoration:underline; }
    .receipt .placeholder { color:#555; font-style:italic; }
    .section { margin-bottom:16px; }
    .section h3 { font-size:12px; color:var(--muted); margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; }
    .kv { display:grid; grid-template-columns:160px 1fr; gap:4px 12px; font-size:13px; }
    .kv .k { color:var(--muted); }
    .warn { color:var(--warn); font-size:13px; }
    .toolbar { display:flex; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); align-items:center; }
    button { background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:7px 12px; border-radius:8px; font:inherit; font-size:12px; cursor:pointer; }
    button:hover { border-color:#35507a; }
    code { font-family:var(--mono); background:#0a111a; padding:2px 6px; border-radius:4px; font-size:.95em; }
    @media (max-width: 980px) { .grid { grid-template-columns:1fr; } .jobs,.detail { max-height:none; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="padding:0 24px;">
      <h1>Open POS Printer Emulator <span style="color:var(--muted); font-weight:500;">Windows Agent</span></h1>
      <div class="sub">Local mode &middot; TCP listener on port <code id="tcpPort">__TCP_PORT__</code> &middot; HTTP UI on this address</div>
    </div>
  </header>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><div class="k">Jobs</div><div class="v" id="statJobs">0</div></div>
      <div class="stat"><div class="k">TCP Port</div><div class="v" id="statPort">__TCP_PORT__</div></div>
      <div class="stat"><div class="k">Mode</div><div class="v" style="font-size:16px;">Windows Local</div></div>
    </div>
    <div class="grid">
      <section class="panel">
        <h2>Recent Jobs</h2>
        <div class="toolbar"><button id="refreshBtn" type="button">Refresh</button><span class="sub" id="statusText"></span></div>
        <div class="jobs" id="jobsList"></div>
      </section>
      <section class="panel">
        <h2>Job Detail</h2>
        <div class="detail" id="detail"><div class="empty">Select a job to inspect receipt preview, warnings, and raw payload.</div></div>
      </section>
    </div>
  </div>
  <script>
    const initialJobs = __JOBS_JSON__;
    let jobs = Array.isArray(initialJobs) ? initialJobs : [];
    let activeId = null;
    const jobsList = document.getElementById('jobsList');
    const detail = document.getElementById('detail');
    const statJobs = document.getElementById('statJobs');
    const statusText = document.getElementById('statusText');

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function badge(status) { const cls = status === 'ok' ? 'ok' : status === 'partial' ? 'partial' : 'parse_error'; return `<span class="badge ${cls}">${esc(status)}</span>`; }

    function renderJobs() {
      statJobs.textContent = String(jobs.length);
      if (!jobs.length) { jobsList.innerHTML = '<div class="empty">No jobs yet. Send ESC/POS bytes to TCP port __TCP_PORT__.</div>'; return; }
      jobsList.innerHTML = jobs.map(j => `
        <div class="job ${activeId===j.id?'active':''}" data-id="${j.id}">
          <div class="top"><span class="id">#${j.id} ${esc(j.external_id)}</span>${badge(j.status)}</div>
          <div class="meta">${esc(j.bytes_received)} bytes &middot; ${esc(j.source_ip||'unknown')} &middot; ${esc(j.created_at||'')}</div>
        </div>`).join('');
      jobsList.querySelectorAll('.job').forEach(el => el.addEventListener('click', () => loadJob(Number(el.dataset.id))));
    }

    function renderReceipt(model) {
      const lines = Array.isArray(model?.lines) ? model.lines : [];
      if (!lines.length) return '<div class="receipt"><div class="line placeholder">[no preview lines]</div></div>';
      return '<div class="receipt">' + lines.map(l => {
        const cls = ['line', l.align === 'center' ? 'center' : l.align === 'right' ? 'right' : '', l.bold ? 'bold' : '', l.underline ? 'u' : '', l.kind ? 'placeholder' : ''].filter(Boolean).join(' ');
        const text = l.text == null || l.text === '' ? (l.kind ? `[${esc(l.kind)}]` : '&nbsp;') : esc(l.text);
        return `<div class="${cls}">${text}</div>`;
      }).join('') + '</div>';
    }

    async function loadJob(id) {
      activeId = id; renderJobs();
      detail.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const res = await fetch(`/api/jobs/${id}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const job = await res.json();
        const warnings = Array.isArray(job.warnings) ? job.warnings : [];
        detail.innerHTML = `
          <div class="section"><h3>Receipt Preview</h3>${renderReceipt(job.render_model)}</div>
          <div class="section"><h3>Metadata</h3><div class="kv">
            <div class="k">Job ID</div><div>${esc(job.id)}</div>
            <div class="k">External ID</div><div><code>${esc(job.external_id)}</code></div>
            <div class="k">Status</div><div>${badge(job.status)}</div>
            <div class="k">Source</div><div>${esc(job.source_ip||'-')}:${esc(job.source_port||'-')}</div>
            <div class="k">Bytes</div><div>${esc(job.bytes_received)}</div>
            <div class="k">SHA-256</div><div><code>${esc(job.sha256)}</code></div>
            <div class="k">Received</div><div>${esc(job.received_at)}</div>
            <div class="k">Completed</div><div>${esc(job.completed_at)}</div>
          </div></div>
          <div class="section"><h3>Warnings</h3>${warnings.length ? `<ul>${warnings.map(w=>`<li class="warn">${esc(w)}</li>`).join('')}</ul>` : '<div class="sub">No warnings.</div>'}</div>
          <div class="section"><h3>Raw (Base64)</h3><pre>${esc(job.raw_base64||'')}</pre></div>
          <div class="section"><h3>Commands</h3><pre>${esc(JSON.stringify(job.commands||[], null, 2))}</pre></div>`;
      } catch (e) {
        detail.innerHTML = `<div class="empty">Failed to load job: ${esc(e.message)}</div>`;
      }
    }

    async function refresh() {
      statusText.textContent = 'Refreshing...';
      try {
        const res = await fetch('/api/jobs?limit=50');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body = await res.json();
        jobs = Array.isArray(body.data) ? body.data : [];
        renderJobs();
        statusText.textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        statusText.textContent = 'Refresh failed';
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);
    renderJobs();
    if (jobs[0]) loadJob(jobs[0].id);
    setInterval(refresh, 5000);
  </script>
</body>
</html>
